<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;

}

body {

    -apple-system,

========================= */

@media (max-width: 500px) {

========================= */

.music-button {

</style>

<body>
<audio
  id="backgroundMusic"
  src="music.mp3"
  loop
  preload="auto">
</audio>

<button
  id="musicBtn"
  class="music-button">
  🎵 Music: OFF
</button>
  
<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loading">

  <h1>⏱️ Time Target</h1>

  <div class="loader"></div>

  <p>Getting everything ready...</p>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div id="app" class="card hidden">

  <h1>⏱️ Time Target</h1>

  <div class="subtitle">
    Everyone gets the same target.<br>
    Closest player wins.
  </div>


  <!-- =========================
       PLAYER SETUP

  <div id="setup">

    >

    <div id="nameSetup" class="name-box hidden">

      </p>

      <div id="nameInputs"></div>

      <button id="startGameBtn">

      </button>

    </div>

  </div>


  <!-- =========================
       GAME AREA
  ========================= -->

  <div id="gameArea" class="hidden">

    <div id="playerTurn" class="player-turn">
      Player 1's Turn
    </div>


    <!-- SHARED TARGET -->

    <div class="target-box">

      <div class="target-label">
        EVERYONE'S TARGET
      </div>

      <div id="target" class="target">
        --.--
      </div>

    </div>


    <!-- TIMER -->

    <div class="timer-box">

      <div id="timer" class="timer">
        --:--
      </div>

    </div>


    <div id="status" class="status">
      Choose the target.
    </div>


    <!-- TARGET BUTTONS -->

    <div class="buttons">

      <button
        id="randomBtn"
        class="random"
      >

      </button>

      <button
        id="customBtn"
        class="custom"
      >
        🎯 Custom Target
      </button>

    </div>


    <!-- CUSTOM TARGET -->

    <div
      id="customArea"
      class="name-box hidden"
    >

      <input
        id="customInput"
        type="number"
        min="0.01"
        step="0.01"
        inputmode="decimal"
        placeholder="Target in seconds"
      >

      <button id="setCustomBtn">
        Set Target For Everyone
      </button>

    </div>


    <!-- START / STOP / SHOW -->

    <div
      class="buttons"
      style="margin-top:10px;"
    >

      <button
        id="startStopBtn"
        class="start"
        disabled
      >
        ▶ Start
      </button>

      <button
        id="showBtn"
        class="show"
        disabled
      >

      id="result"
      class="result"

      </button>

      id="winner"

    >

      <div>

        id="winnerName"

      </div>

    <!-- SCORES -->

    <div
      id="history"

    >

      <h2>📊 Scores</h2>

      <div id="historyList"></div>

    <!-- NEW GAME -->

    <button
      id="newGameBtn"

      ↻ New Game
    </button>

</div>


<script>

/* =========================
   GAME STATE
========================= */

let playerCount = 0;
let playerNames = [];
let currentPlayer = 1;

let targetTime = null;

let startTime = null;
let elapsed = 0;

let running = false;
let finished = false;

let animationFrame = null;

let audio = null;

let scores = {};


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const setup =
document.getElementById("setup");

const gameArea =
document.getElementById("gameArea");

const playerCountInput =
document.getElementById("playerCountInput");

const continuePlayersBtn =
document.getElementById("continuePlayersBtn");

const nameSetup =
document.getElementById("nameSetup");

const nameInputs =
document.getElementById("nameInputs");

const startGameBtn =
document.getElementById("startGameBtn");

const playerTurn =
document.getElementById("playerTurn");

const target =
document.getElementById("target");

const timer =
document.getElementById("timer");

const status =
document.getElementById("status");

const randomBtn =
document.getElementById("randomBtn");

const customBtn =
document.getElementById("customBtn");

const customArea =
document.getElementById("customArea");

const customInput =
document.getElementById("customInput");

const setCustomBtn =
document.getElementById("setCustomBtn");

const startStopBtn =
document.getElementById("startStopBtn");

const showBtn =
document.getElementById("showBtn");

const result =
document.getElementById("result");

const nextArea =
document.getElementById("nextArea");

const nextBtn =
document.getElementById("nextBtn");

const winner =
document.getElementById("winner");

const winnerName =
document.getElementById("winnerName");

const winnerScore =
document.getElementById("winnerScore");

const historyList =
document.getElementById("historyList");

const newGameBtn =
document.getElementById("newGameBtn");


/* =========================
   LOADING SCREEN
========================= */

window.addEventListener("load", function() {

  setTimeout(function() {

    loading.classList.add("hidden");

    app.classList.remove("hidden");

  }, 1500);

});


/* =========================
   LOUD BEEP
========================= */

function beep(
  frequency = 800,
  duration = 180
) {

  if (!audio) {

    audio = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }

  if (audio.state === "suspended") {

    audio.resume();

  }

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();

  oscillator.type = "square";

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    0.001,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.9,
    audio.currentTime + 0.015
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime +
    duration / 1000
  );

  oscillator.connect(gain);

  gain.connect(audio.destination);

  oscillator.start();

  oscillator.stop(
    audio.currentTime +
    duration / 1000 +
    0.03
  );

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(seconds) {

  return seconds.toFixed(2);

}


/* =========================
   CHOOSE PLAYER COUNT
========================= */

continuePlayersBtn.onclick =
function() {

  const value =
    Number(
      playerCountInput.value
    );


  if (
    !Number.isFinite(value) ||
    value < 1 ||
    !Number.isInteger(value)
  ) {

    alert(
      "Enter a whole number of players."
    );

    return;

  }


  playerCount = value;


  /*
     CREATE NAME INPUTS
  */

  nameInputs.innerHTML = "";


  for (
    let i = 1;
    i <= playerCount;
    i++
  ) {

    const input =
      document.createElement("input");

    input.type = "text";

    input.className =
      "player-name-input";

    input.placeholder =
      "Player " + i;

    input.value =
      "Player " + i;

    input.maxLength = 30;

    nameInputs.appendChild(input);

  }


  nameSetup.classList.remove(
    "hidden"
  );


  continuePlayersBtn.classList.add(
    "hidden"
  );


  playerCountInput.classList.add(
    "hidden"
  );


  beep(900, 180);

};


/* =========================
   START GAME
========================= */

startGameBtn.onclick =
function() {

  const inputs =
    document.querySelectorAll(
      ".player-name-input"
    );


  playerNames = [];


  inputs.forEach(
    function(input, index) {

      const name =
        input.value.trim();


      if (name.length > 0) {

        playerNames.push(name);

      }

      else {

        playerNames.push(
          "Player " +
          (index + 1)
        );

      }

    }
  );


  /*
     CREATE SCORE LIST
  */

  scores = {};


  for (
    let i = 1;
    i <= playerCount;
    i++
  ) {

    scores[i] = null;

  }


  currentPlayer = 1;

  targetTime = null;

  setup.classList.add(
    "hidden"
  );

  gameArea.classList.remove(
    "hidden"
  );


  historyList.innerHTML = "";

  target.textContent =
    "--.--";

  timer.textContent =
    "--:--";


  resetRound();


  status.textContent =
    playerNames[0] +
    ": choose the target.";


  beep(1000, 200);

};


/* =========================
   RESET ROUND
========================= */

function resetRound() {

  playerTurn.textContent =
    playerNames[
      currentPlayer - 1
    ] +
    "'s Turn";


  timer.textContent =
    "--:--";


  result.textContent = "";

  result.className =
    "result";


  startStopBtn.textContent =
    "▶ Start";


  startStopBtn.classList.remove(
    "stop"
  );

  startStopBtn.classList.add(
    "start"
  );


  startStopBtn.disabled =
    targetTime === null;


  showBtn.disabled = true;


  randomBtn.disabled =
    targetTime !== null;


  customBtn.disabled =
    targetTime !== null;


  customArea.classList.add(
    "hidden"
  );


  customInput.value = "";


  nextArea.classList.add(
    "hidden"
  );


  winner.classList.add(
    "hidden"
  );


  elapsed = 0;

  startTime = null;

  running = false;

  finished = false;

}

/* =========================
   RANDOM TARGET
========================= */

randomBtn.onclick = function() {

  if (targetTime !== null) return;


  targetTime =
    Math.random() * 14.9 + 0.1;


  targetTime =
    Math.round(
      targetTime * 100
    ) / 100;


  target.textContent =
    formatTime(targetTime) + "s";


  status.textContent =
    "🎯 Everyone's target is locked!";


  startStopBtn.disabled = false;

  randomBtn.disabled = true;

  customBtn.disabled = true;


  beep(1000, 150);

};


/* =========================
   CUSTOM TARGET BUTTON
========================= */

customBtn.onclick = function() {

  if (targetTime !== null) return;


  customArea.classList.toggle(
    "hidden"
  );


  if (
    !customArea.classList.contains(
      "hidden"
    )
  ) {

    customInput.focus();

  }

};


/* =========================
   SET CUSTOM TARGET
========================= */

setCustomBtn.onclick = function() {

  const value =
    parseFloat(
      customInput.value
    );


  if (
    !Number.isFinite(value) ||
    value <= 0
  ) {

    alert(
      "Enter a valid target."
    );

    return;

  }


  targetTime = value;


  target.textContent =
    formatTime(targetTime) + "s";


  status.textContent =
    "🎯 Everyone's target is locked!";


  startStopBtn.disabled = false;

  randomBtn.disabled = true;

  customBtn.disabled = true;


  customArea.classList.add(
    "hidden"
  );


  beep(1000, 150);

};


/* =========================
   TIMER LOOP
========================= */

function updateTimer() {

  if (!running) return;


  elapsed =
    (
      performance.now() -
      startTime
    ) / 1000;


  /*
     We deliberately don't show
     the time while running.

     The player has to rely
     on their own timing.
  */

  animationFrame =
    requestAnimationFrame(
      updateTimer
    );

}


/* =========================
   START / STOP BUTTON
========================= */

startStopBtn.onclick =
function() {


  /* =====================
     START
  ===================== */

  if (
    !running &&
    !finished
  ) {

    startTime =
      performance.now();


    elapsed = 0;

    running = true;


    startStopBtn.textContent =
      "■ Stop";


    startStopBtn.classList.remove(
      "start"
    );

    startStopBtn.classList.add(
      "stop"
    );


    status.textContent =
      "Timer running...";


    beep(900, 200);


    updateTimer();

    return;

  }


  /* =====================
     STOP
  ===================== */

  if (running) {

    elapsed =
      (
        performance.now() -
        startTime
      ) / 1000;


    running = false;

    finished = true;


    cancelAnimationFrame(
      animationFrame
    );


    startStopBtn.disabled = true;

    showBtn.disabled = false;


    status.textContent =
      "Stopped! Reveal your time.";


    beep(500, 250);

  }

};


/* =========================
   SHOW TIME
========================= */

showBtn.onclick =
function() {

  if (!finished) return;


  timer.textContent =
    formatTime(elapsed);


  status.textContent =
    "Actual time:";


  const difference =
    Math.abs(
      elapsed -
      targetTime
    );


  /* =====================
     RESULT MESSAGE
  ===================== */

  if (difference <= 0.05) {

    result.className =
      "result";

    result.textContent =
      "🎯 PERFECT! " +
      formatTime(difference) +
      "s away!";

  }

  else if (difference <= 0.25) {

    result.className =
      "result";

    result.textContent =
      "🔥 VERY CLOSE! " +
      formatTime(difference) +
      "s away.";

  }

  else if (difference <= 1) {

    result.className =
      "result";

    result.textContent =
      "👍 Close! " +
      formatTime(difference) +
      "s away.";

  }

  else {

    result.className =
      "result";

    result.textContent =
      "😅 " +
      formatTime(difference) +
      "s away.";

  }


  /* =====================
     SAVE SCORE
  ===================== */

  scores[currentPlayer] =
    difference;


  showBtn.disabled = true;


  /* =====================
     REVEAL BEEP
  ===================== */

  beep(1100, 220);


  setTimeout(
    function() {

      beep(1500, 250);

    },
    180
  );


  /* =====================
     ADD SCORE
  ===================== */

  const round =
    document.createElement("div");


  round.className =
    "round";


  round.innerHTML =

    "<span>" +

    playerNames[
      currentPlayer - 1
    ] +

    "</span>" +

    "<span>" +

    formatTime(elapsed) +

    "s</span>" +

    "<span>±" +

    formatTime(difference) +

    "s</span>";


  historyList.prepend(
    round
  );


  /* =====================
     NEXT PLAYER
  ===================== */

  if (
    currentPlayer <
    playerCount
  ) {

    nextArea.classList.remove(
      "hidden"
    );

  }

  else {

    setTimeout(
      showWinner,
      500
    );

  }

};


/* =========================
   NEXT PLAYER
========================= */

nextBtn.onclick =
function() {

  currentPlayer++;


  resetRound();


  status.textContent =
    "Same target: " +
    formatTime(targetTime) +
    "s";


  beep(900, 180);

};


/* =========================
   WINNER
========================= */

function showWinner() {

  let bestScore =
    Infinity;


  let winners = [];


  /*
     FIND BEST SCORE
  */

  for (
    let i = 1;
    i <= playerCount;
    i++
  ) {

    if (
      scores[i] !== null &&
      scores[i] !== undefined
    ) {


      if (
        scores[i] <
        bestScore
      ) {

        bestScore =
          scores[i];

        winners = [i];

      }

      else if (
        scores[i] ===
        bestScore
      ) {

        winners.push(i);

      }

    }

  }


  winner.classList.remove(
    "hidden"
  );


  /* =====================
     TIE
  ===================== */

  if (
    winners.length > 1
  ) {

    winnerName.textContent =
      winners
        .map(
          function(player) {

            return playerNames[
              player - 1
            ];

          }
        )
        .join(" & ");


    winnerScore.textContent =
      "🏆 It's a tie!";

  }


  /* =====================
     SINGLE WINNER
  ===================== */

  else {

    const winningPlayer =
      winners[0];


    winnerName.textContent =
      playerNames[
        winningPlayer - 1
      ];


    winnerScore.textContent =
      "Closest to " +

      formatTime(targetTime) +

      "s — only " +

      formatTime(bestScore) +

      "s away!";

  }


  /* =====================
     WINNER BEEP
  ===================== */

  beep(1200, 180);


  setTimeout(
    function() {

      beep(1500, 180);

    },
    180
  );


  setTimeout(
    function() {

      beep(1800, 300);

    },
    360
  );

}

/* =========================
   NEW GAME
========================= */

newGameBtn.onclick = function() {

  cancelAnimationFrame(
    animationFrame
  );


  /* RESET GAME STATE */

  playerCount = 0;

  playerNames = [];

  currentPlayer = 1;

  targetTime = null;

  startTime = null;

  elapsed = 0;

  running = false;

  finished = false;

  animationFrame = null;

  scores = {};


  /* RESET INPUTS */

  playerCountInput.value = "";

  nameInputs.innerHTML = "";

  customInput.value = "";


  /* RESET SCREENS */

  gameArea.classList.add(
    "hidden"
  );

  nameSetup.classList.add(
    "hidden"
  );

  continuePlayersBtn.classList.remove(
    "hidden"
  );

  playerCountInput.classList.remove(
    "hidden"
  );


  /* RESET GAME DISPLAY */

  target.textContent =
    "--.--";

  timer.textContent =
    "--:--";

  result.textContent = "";

  historyList.innerHTML = "";


  winner.classList.add(
    "hidden"
  );


  /* GO BACK TO SETUP */

  setup.classList.remove(
    "hidden"
  );


  status.textContent =
    "Choose the target.";


  beep(700, 150);

};

   PREVENT NEGATIVE / WEIRD
   PLAYER COUNTS
========================= */

playerCountInput.addEventListener(
  "input",
  function() {

    if (
      Number(this.value) < 1
    ) {

      this.value = "";

    }

  }
);

      audio = new (
        window.AudioContext ||

      )();

    if (

    ) {
